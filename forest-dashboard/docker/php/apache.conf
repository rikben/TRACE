# /forest-dashboard/docker/php/apache.conf

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public_html

    <Directory /var/www/html/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/forest-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/forest-dashboard-access.log combined
</VirtualHost>